[project]
name = "sensedoc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DevXMoses", email = "mosesoparah@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sensedoc = "sensedoc:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
